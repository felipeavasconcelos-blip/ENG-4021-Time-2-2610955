{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edição de Usuário - MedMap</title>
    <link rel="stylesheet" href="/static/css/EdicaoUsuario.css">
</head>

<body>

<nav>
    <h2>MedMap</h2>

    <div class="navegacao">
        <a href="{% url 'InicioLogado' %}">Início</a>
        <a href="{% url 'PreferenciasNotificacoes' %}">Preferências</a>
        <a href="{% url 'ConsentimentoDados' %}">Consentimento</a>
        <a href="{% url 'RemocaoUsuario' %}">Remoção</a>
    </div>
</nav>

<main>

<h1>Edite o seu Perfil</h1>
<p>Atualize suas informações e sua foto de perfil.</p>

<div id="caixa">

<form>

<div id="foto-perfil">
    <img id="previa" hidden>
    <span id="iniciais">+</span>
</div>

<label id="botao-foto" for="foto">Alterar foto de perfil</label>
<input type="file" id="foto" accept="image/*">

<label for="nome">Nome completo</label>
<input type="text" id="nome" placeholder="Seu nome">

<label for="email">E-mail</label>
<input type="email" id="email" placeholder="voce@email.com">

<label for="telefone">Telefone</label>
<input type="tel" id="telefone" placeholder="(00) 00000-0000">

<label for="senha">Nova senha</label>
<input type="password" id="senha" placeholder="Deixe em branco para manter a atual">

<button>Salvar alterações</button>

<p><a href="{% url 'InicioLogado' %}">Voltar ao início</a></p>
<p><a href="{% url 'RemocaoUsuario' %}">Excluir minha conta</a></p>

</form>

</div>

</main>

<script>
const foto=document.getElementById("foto");
const previa=document.getElementById("previa");
const iniciais=document.getElementById("iniciais");

foto.addEventListener("change",function(){
    const arquivo=foto.files[0];
    if(!arquivo)return;
    previa.src=URL.createObjectURL(arquivo);
    previa.hidden=false;
    iniciais.hidden=true;
});
</script>

</body>
</html>
