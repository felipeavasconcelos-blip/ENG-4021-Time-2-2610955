{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci senha - MedMap</title>
    <link rel="stylesheet" href="{% static 'css/EsqueciSenha.css' %}">
</head>
<body>
    <nav>
       <h2>MedMap</h2>
       <ul class="navegacao">
            <li><a href="{% url 'home' %}">Página inicial</a></li>
            <li><a href="{% url 'ComoUsar' %}">Como usar</a></li>
            <li><a href="{% url 'Artigos' %}">Artigos</a></li>
            <li><a href="{% url 'Tela' %}">Sair</a></li>
       </ul>
    </nav>
    <main>
       <section id="RecuperarSenha">
           <h1>Esqueceu sua senha?</h1>
           <p>Informe seu e-mail para receber instruções de recuperação da senha.</p>

           <div id="caixa">
                <form>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="voce@email.com" required>

                    <button type="submit">Enviar instruções</button>

                    <p><a href="{% url 'Tela' %}">Voltar para entrar na conta</a></p>
                </form>
            </div>
       </section>
    </main>
</body>
</html>
