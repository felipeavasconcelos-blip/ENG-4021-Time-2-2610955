{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - MedMap</title>
    <link rel="stylesheet" href="{% static 'css/CriarConta.css' %}">
</head>

<body>

    <nav>
        <h2>MedMap</h2>

        <ul class="navegacao">
            <li><a href="{% url 'Tela' %}">login</a></li>
            <li><a href="{% url 'ComoUsar' %}">Como Usar</a></li>
            <li><a href="{% url 'Artigos' %}">Artigos</a></li>
        </ul>
    </nav>

    <main>

        <section id="criar-conta">

            <h1>Crie sua conta</h1>

            <p>Preencha seus dados para começar a usar o MedMap.</p>

            <div id="caixa">

                <form method="POST">
                   {% csrf_token %}

                   {% if erro %}
                      <p class="erro">{{ erro }}</p>
                   {% endif %}

                   <label for="nome">Nome</label>
                   <input
                      type="text"
                      id="nome"
                      name="nome"
                      placeholder="Seu nome"
                      value="{{ nome|default:'' }}"
                      required
                   >

                   <label for="email">E-mail</label>
                   <input
                      type="email"
                      id="email"
                      name="email"
                      placeholder="voce@email.com"
                      value="{{ email|default:'' }}"
                      required
                   >

                   <label for="senha">Senha</label>
                   <input
                      type="password"
                      id="senha"
                      name="senha"
                      placeholder="Mínimo de 6 caracteres"
                      minlength="6"
                      required
                   >

                   <label for="confirmar-senha">Confirmar senha</label>
                   <input
                      type="password"
                      id="confirmar-senha"
                      name="confirmar_senha"
                      placeholder="Digite a senha novamente"
                      minlength="6"
                      required
                   >

                   <button type="submit">Criar conta</button>
                </form>
                

                <p>
                    Já possui uma conta?
                    <a href="{% url 'Tela' %}">Entrar</a>
                </p>

            </div>

        </section>

    </main>

    <footer>
        <p>MedMap - seu mapa de saúde preventiva</p>
    </footer>
    
</body>
</html>
