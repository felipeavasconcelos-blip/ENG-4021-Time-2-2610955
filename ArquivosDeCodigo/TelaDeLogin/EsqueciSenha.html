<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci senha - MedMap</title>
    <link rel="stylesheet" href="css/EsqueciSenha.css">
</head>
<body>
    <nav>
       <h2>MedMap</h2>
    </nav>
    <main>
       <section id="Criar Conta">
           <h1>Crie a sua Conta</h1>
           <div id="caixa">
                <form>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="voce@email.com" required>

                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Mínimo de 6 digitos" minlength="6" required>

                    <button type="submit">Criar conta</button>
                    <p><a href="Tela.html">Voltar a tela de login</a></p>
                </form>

         

            </div>

       </section>



    </main>

</body>
</html>
