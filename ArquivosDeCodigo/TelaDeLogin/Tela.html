<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na conta - MedMap </title>
    <link rel="stylesheet" href="css/Login.css">
</head>
<body>
    <nav>
        <h2>MedMap</h2>
        <ul class="navegacao">
            <li><a href="PaginaInicial.html">Página inicial</a></li>
            <li><a href="ComoUsar.html">Como usar</a></li>
        </ul>
    </nav>

    <main>
        <section id="login">
            <h1>Entrar na sua conta</h1>
            <p>Use seu e-mail e uma senha de pelo menos 6 caracteres.</p>

            <div id="caixa">
                <form>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="voce@email.com" required>

                    <label for="senha">Senha</label>
                    <input type="password" id="senha" minlength="6" required>

                    <button type="submit">Entrar</button>
                </form>

                <p><a href="EsqueciSenha.html">Esqueci minha senha</a></p>
                <p>Ainda não tem conta? <a href="CriarConta.html">Criar conta</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>MedMap - seu mapa de saúde preventiva</p>
    </footer>
</body>
</html>
